[project]
name = "querytale"
version = "0.1.0"
description = "See what your NextDNS queries tell: sync logs to a local DuckDB file and review activity."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jeff Peck" }]
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "keyring>=25",
    "platformdirs>=4",
    "rich>=13",
    "tomli-w>=1.0",
    "typer>=0.12",
]

[project.scripts]
querytale = "querytale.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
