name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  install:
    # A clean-machine install of the built wheel: catches missing package data.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Install the wheel in an isolated tool environment and run it
        env:
          QUERYTALE_HOME: ${{ runner.temp }}/qt-home
        run: |
          uv tool install --python 3.12 dist/*.whl
          querytale --help
          querytale services | grep -q google-classroom
          querytale doctor
