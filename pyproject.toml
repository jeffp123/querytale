[project]
name = "querytale"
version = "0.1.0"
description = "See what your NextDNS queries tell: sync logs to a local DuckDB file and review activity."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "src/querytale/data/NOTICE", "src/querytale/vendor/ECHARTS-*"]
authors = [{ name = "Jeff Peck" }]
keywords = ["nextdns", "dns", "parental", "screen-time", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Name Service (DNS)",
]
dependencies = [
    "astral>=3.2",
    "duckdb>=1.1",
    "httpx>=0.27",
    "keyring>=25",
    "platformdirs>=4",
    "pyyaml>=6.0.3",
    "rich>=13",
    "tomli-w>=1.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/jeffp123/querytale"
Issues = "https://github.com/jeffp123/querytale/issues"

[project.scripts]
querytale = "querytale.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/PLAN.md", "/CLAUDE.md"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
